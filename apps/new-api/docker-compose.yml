services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4455:4455"
    environment:
      PORT: 4455
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/new_api?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: change_me
      NEW_API_BOOTSTRAP_TOKEN: change_me_bootstrap_token
      LOG_LEVEL: debug
      REQUEST_TIMEOUT_MS: 30000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: new_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d new_api"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
