<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="天宫 TAI 公众号积分充值 — 微信登录、绑定账号、快捷购买积分。" />
  <title>天宫 TAI · 积分充值</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/wechat-recharge.css" />
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div class="hero-badge">天宫 TAI · 公众号专享</div>
      <h1>积分充值</h1>
      <p>微信登录并绑定账号后，可直接购买积分。支付完成后请添加私域微信，获取专属服务。</p>
    </section>

    <section id="section-loading" class="card">
      <div class="status">正在加载，请稍候...</div>
    </section>

    <section id="section-outside-wechat" class="card hidden">
      <h2 class="card-title">请在微信中打开</h2>
      <p class="status">本页面用于公众号菜单跳转，请在微信内打开以完成登录与支付。</p>
      <button id="reload-btn" class="btn btn-secondary" type="button">刷新页面</button>
    </section>

    <section id="section-bind" class="card hidden">
      <h2 class="card-title">绑定手机号</h2>
      <p class="status" style="padding-top: 0; padding-bottom: 16px;">首次使用需绑定手机号，用于账号识别与积分到账。</p>
      <div class="field">
        <label for="bind-phone">手机号</label>
        <input id="bind-phone" type="tel" maxlength="11" placeholder="请输入手机号" autocomplete="tel" />
      </div>
      <div class="field">
        <label for="bind-code">验证码</label>
        <div class="code-row">
          <input id="bind-code" type="text" maxlength="6" placeholder="短信验证码" autocomplete="one-time-code" />
          <button id="send-code-btn" class="btn btn-secondary" type="button" style="width: 120px; flex-shrink: 0;">获取验证码</button>
        </div>
      </div>
      <button id="bind-submit-btn" class="btn btn-primary" type="button">绑定并继续</button>
    </section>

    <section id="section-recharge" class="card hidden">
      <h2 class="card-title">选择充值档位</h2>
      <div class="user-chip">
        <div>
          <strong id="user-name">微信用户</strong>
          <span id="user-phone">已绑定账号</span>
        </div>
      </div>
      <div id="package-list" class="packages"></div>
      <button id="pay-btn" class="btn btn-primary" type="button" style="margin-top: 16px;">立即支付</button>
    </section>

    <section id="section-success" class="card hidden">
      <p class="success-title">支付成功</p>
      <p class="status" style="padding-top: 0;">积分已充值到您的账号，请添加下方私域微信。</p>
      <div class="qr-wrap">
        <img id="success-qr" alt="私域微信二维码" />
      </div>
      <p id="success-tip" class="qr-tip"></p>
    </section>

    <section id="section-error" class="card hidden">
      <h2 class="card-title">暂时无法继续</h2>
      <p id="error-message" class="status error"></p>
      <button id="retry-btn" class="btn btn-primary" type="button">重新授权</button>
    </section>

    <p class="footer-note">支付完成后积分自动到账。如有问题，请联系天宫 TAI 客服。</p>
  </div>

  <script src="/wechat-recharge.js"></script>
</body>
</html>
